# GitHub Actions の部品（checkout・setup-node など）の新しい版を、月1回まとめて PR で知らせる。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # 出たばかりの版は7日待ってから提案する（乗っ取られた直後の版を拾いにくくする）
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
